<!doctype html>
<head>
  <script src="../template.v2.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf8">
  <meta name="repo-url" content="https://github.com/texonom/template">
</head>
<body>
  <distill-header></distill-header>
  <main style="margin: 20px; font-family: sans-serif; text-align: center;">
    <p id="redirect-message">Redirecting to Pull Requests…</p>
  </main>
  <distill-footer></distill-footer>
  <script type="module">
    const messageEl = document.getElementById('redirect-message');
    const fallbackRepo = document
      .querySelector('meta[name="repo-url"]')
      ?.getAttribute('content')
      ?.trim();

    const redirectToRepo = repoUrl => {
      const cleaned = (repoUrl || fallbackRepo || '').replace(/^git\+/, '').replace(/\.git$/, '');
      if (!cleaned) {
        messageEl.textContent = 'Unable to determine repository URL.';
        return;
      }
      if (!cleaned.endsWith('/pull/new')) {
        messageEl.textContent = 'Redirecting to Pull Requests at ' + cleaned + '…';
        window.location.href = cleaned.replace(/\/?$/, '') + '/pull/new';
      } else {
        messageEl.textContent = 'Redirecting to Pull Requests at ' + cleaned + '…';
        window.location.href = cleaned;
      }
    };

    fetch('../package.json')
      .then(r => (r.ok ? r.json() : Promise.reject(new Error('package.json not accessible'))))
      .then(pkg => {
        const repoUrl = (pkg.repository && pkg.repository.url) || pkg.homepage || fallbackRepo;
        redirectToRepo(repoUrl);
      })
      .catch(() => {
        redirectToRepo(fallbackRepo);
      });
  </script>
</body>
