<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archive</title>
    <script src="/template.v2.js"></script>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        background-color: hsl(200, 60%, 15%);
      }

      d-article {
        display: block;
        background: white;
        color: rgba(0, 0, 0, 0.8);
        padding-bottom: 72px;
      }

      d-article.centered > h1 {
        margin: 72px 24px 12px;
        font-weight: 400;
        font-family: Cochin, Georgia, serif;
        font-size: 46px;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      @media (min-width: 768px) {
        d-article.centered > h1 {
          margin: 96px 72px 24px;
          font-size: 54px;
        }
      }

      @media (min-width: 1080px) {
        d-article.centered > h1 {
          margin-left: auto;
          margin-right: auto;
          text-align: center;
        }
      }

      .issues {
        margin: 0 24px 48px;
      }

      @media (min-width: 768px) {
        .issues {
          margin-left: 72px;
          margin-right: 72px;
        }
      }

      @media (min-width: 1080px) {
        .issues {
          margin-left: auto;
          margin-right: auto;
          max-width: 648px;
        }
      }

      .issues ul {
        margin-top: 12px;
        padding: 0;
        list-style: none;
      }

      .issues li {
        margin-bottom: 16px;
      }

      .issues li a {
        border-bottom: 1px solid rgba(0, 0, 0, 0.2);
        text-decoration: none;
      }

      .issues li a:hover {
        border-bottom-color: rgba(0, 0, 0, 0.4);
      }

      .issues li div,
      .issues li .doi {
        font-family: -apple-system, BlinkMacSystemFont, "Roboto", Helvetica, sans-serif;
        color: grey;
        font-size: 13px;
        line-height: 20px;
      }

      .empty {
        margin: 48px 0;
        font-family: -apple-system, BlinkMacSystemFont, "Roboto", Helvetica, sans-serif;
        color: rgba(0, 0, 0, 0.6);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <distill-header></distill-header>
    <d-article class="centered">
      <h1>Distill Archive</h1>
      <div class="issues">
        
        <ul>
          <li><a href="/index.html">Why Momentum Really Works</a><div data-published-date="2017-01-10T00:00:00.000Z">Jan 10, 2017</div><div>Chris Olah, Ludwig Schubert, Shan Carter</div></li>
        </ul>
      
      </div>
    </d-article>
    <distill-footer></distill-footer>
  </body>
</html>
